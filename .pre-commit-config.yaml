repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (worker)
        language: system
        entry: npm --prefix worker run lint:fix
        files: ^worker/.*\.[cm]?[jt]sx?$
        pass_filenames: false
      - id: prettier
        name: prettier (worker)
        language: system
        entry: npm --prefix worker run format
        files: ^worker/.*\.(js|mjs|cjs|ts|tsx|json|md|yml|yaml)$
        pass_filenames: false
